services:
  api:
    build:
      context: ./apps/api
    container_name: go-maso-api
    restart: unless-stopped

    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      HTTP_ADDRESS: :8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gomaso.local}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SECRETS_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-30m}
      SESSION_ABSOLUTE_TIMEOUT: ${SESSION_ABSOLUTE_TIMEOUT:-12h}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      MONITOR_WORKERS: ${MONITOR_WORKERS:-10}
      RESULT_RETENTION_DAYS: ${RESULT_RETENTION_DAYS:-30}

    secrets:
      - database_url
      - admin_password
      - encryption_key

    ports:
      - "${API_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy

    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    container_name: go-maso-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: gomaso
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: go_maso

    secrets:
      - postgres_password

    ports:
      - "${POSTGRES_PORT:-5434}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gomaso -d go_maso"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password.txt}
  database_url:
    file: ${DATABASE_URL_FILE:-./secrets/database_url.txt}
  admin_password:
    file: ${ADMIN_PASSWORD_FILE:-./secrets/admin_password.txt}
  encryption_key:
    file: ${SECRETS_ENCRYPTION_KEY_FILE:-./secrets/encryption_key.txt}
