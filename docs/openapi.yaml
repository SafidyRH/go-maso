openapi: 3.1.0
info:
  title: Go-Maso API
  version: 0.3.0
  description: |
    API contract for the Go-Maso MVP monitoring, incident, and webhook alerting platform.
    Except for health checks and login, operations require a server-side session cookie.
    Every authenticated non-safe request also requires X-CSRF-Token copied from the CSRF cookie.
servers:
  - url: http://localhost:8080
security:
  - sessionCookie: []

paths:
  /healthz:
    get:
      security: []
      summary: Check API liveness
      responses:
        "200":
          description: The API process is alive.
  /readyz:
    get:
      security: []
      summary: Check API and database readiness
      responses:
        "200":
          description: The API and PostgreSQL are ready.
        "503":
          description: PostgreSQL is unavailable.

  /auth/login:
    post:
      security: []
      summary: Create an administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Authenticated administrator. The response sets the HttpOnly session cookie and the CSRF cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { description: Invalid credentials. }
        "429": { description: Too many failed login attempts. }

  /auth/me:
    get:
      summary: Return the authenticated administrator
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { description: Authentication required or session expired. }

  /auth/logout:
    post:
      summary: Revoke the current session
      description: Requires the X-CSRF-Token header copied from the go_maso_csrf (or __Host-go_maso_csrf) cookie.
      responses:
        "204": { description: Session revoked and cookies expired. }
        "403": { description: Invalid CSRF token. }

  /applications:
    get:
      summary: List active applications
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of applications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPage"
    post:
      summary: Create an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Application created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"

  /applications/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get an application
      responses:
        "200":
          description: Application found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationPatch"
      responses:
        "200":
          description: Application updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Archive an application
      responses:
        "204":
          description: Application archived.
        "404":
          $ref: "#/components/responses/NotFound"

  /applications/{applicationID}/environments:
    parameters:
      - name: applicationID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List an application's environments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of environments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentPage"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Create an environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentInput"
      responses:
        "201":
          description: Environment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /environments/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get an environment
      responses:
        "200":
          description: Environment found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update or enable an environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentPatch"
      responses:
        "200":
          description: Environment updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Archive an environment
      responses:
        "204":
          description: Environment archived.
        "404":
          $ref: "#/components/responses/NotFound"

  /environments/{environmentID}/monitors:
    parameters:
      - name: environmentID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List an environment's monitors
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of monitors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorPage"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Create an HTTP monitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorInput"
      responses:
        "201":
          description: Monitor created and scheduled when enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Monitor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /monitors/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get a monitor
      responses:
        "200":
          description: Monitor found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Monitor"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update or enable a monitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorPatch"
      responses:
        "200":
          description: Monitor updated and rescheduled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Monitor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Archive a monitor
      responses:
        "204":
          description: Monitor archived and unscheduled.
        "404":
          $ref: "#/components/responses/NotFound"

  /monitors/{id}/check:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Run and persist a monitor check immediately
      responses:
        "200":
          description: Check completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /monitors/{id}/checks:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/Limit"
    get:
      summary: List recent check results
      responses:
        "200":
          description: Recent results, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /monitors/{id}/monitoring-summary:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get the current state and 24-hour summary
      responses:
        "200":
          description: Monitor summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /monitors/{id}/alert-rule:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get the monitor alert rule or its defaults
      responses:
        "200":
          description: Alert rule configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Create or replace the monitor alert rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "200":
          description: Saved alert rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /monitors/{id}/alert-rule/signing-secret/rotate:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Rotate and reveal the webhook HMAC key once
      description: Requires a valid CSRF token. Queued deliveries retain the key active when they were created.
      responses:
        "200":
          description: New signing key. Store it immediately because later reads never expose it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningSecretRotation" }
        "404": { $ref: "#/components/responses/NotFound" }

  /monitors/{id}/maintenance-windows:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: List current and upcoming monitor maintenance windows
      responses:
        "200":
          description: Maintenance windows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaintenanceWindow" }
    post:
      summary: Schedule a monitor maintenance window
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceInput" }
      responses:
        "201":
          description: Scheduled maintenance window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceWindow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /maintenance-windows/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      summary: Cancel a maintenance window
      responses:
        "204": { description: Maintenance window cancelled. }
        "404": { $ref: "#/components/responses/NotFound" }

  /incidents:
    get:
      summary: List incidents
      parameters:
        - name: application_id
          in: query
          schema: { type: string, format: uuid }
        - name: monitor_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/IncidentStatus" }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Incidents ordered by active state and start time.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /incidents/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get an incident
      responses:
        "200":
          description: Incident details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "404": { $ref: "#/components/responses/NotFound" }

  /incidents/{id}/acknowledge:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Acknowledge an active incident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcknowledgementInput" }
      responses:
        "200":
          description: Acknowledged incident.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The incident is already resolved. }

  /incidents/{id}/events:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: List the incident audit trail
      responses:
        "200":
          description: Incident events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IncidentEvent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /incidents/{id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: List notification delivery attempts for an incident
      responses:
        "200":
          description: Notification deliveries without destination secrets or payloads.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationDelivery" }
        "404": { $ref: "#/components/responses/NotFound" }

  /dashboard:
    get:
      summary: List application-level monitoring aggregates
      responses:
        "200":
          description: Application dashboard rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationOverview"

  /dashboard/applications/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: period_hours
        in: query
        description: Analysis period used for statistics and timeline buckets.
        schema:
          type: integer
          enum: [1, 6, 24, 168, 720]
          default: 24
    get:
      summary: Get an operational application dashboard
      responses:
        "200":
          description: Application metadata, period statistics, environments, monitors, timeline, and recent events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDashboard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: go_maso_session
      description: Server-side session cookie. HTTPS deployments use the __Host-go_maso_session name.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist or is archived.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, maxLength: 128 }
    User:
      type: object
      required: [id, email, role, disabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN] }
        disabled: { type: boolean }
        last_login_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Application:
      type: object
      required: [id, name, owner, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        owner: { type: string, maxLength: 120 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ApplicationInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        owner: { type: string, maxLength: 120 }
    ApplicationPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        owner: { type: string, maxLength: 120 }
    ApplicationPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Application" }

    Environment:
      type: object
      required: [id, application_id, name, base_url, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        base_url: { type: string, format: uri }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EnvironmentInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        base_url: { type: string, format: uri }
        enabled: { type: boolean, default: true }
    EnvironmentPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        base_url: { type: string, format: uri }
        enabled: { type: boolean }
    EnvironmentPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Environment" }

    Monitor:
      allOf:
        - $ref: "#/components/schemas/MonitorInput"
        - type: object
          required: [id, environment_id, effective_enabled, current_status, consecutive_failures, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            environment_id: { type: string, format: uuid }
            effective_enabled: { type: boolean }
            current_status: { $ref: "#/components/schemas/MonitorStatus" }
            consecutive_failures: { type: integer, minimum: 0 }
            last_checked_at: { type: string, format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    MonitorInput:
      type: object
      required: [name, url]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        url: { type: string, format: uri }
        method: { type: string, enum: [GET, HEAD], default: GET }
        check_interval_seconds: { type: integer, minimum: 5, default: 30 }
        timeout_ms: { type: integer, minimum: 100, maximum: 60000, default: 5000 }
        expected_status_min: { type: integer, minimum: 100, maximum: 599, default: 200 }
        expected_status_max: { type: integer, minimum: 100, maximum: 599, default: 299 }
        failure_threshold: { type: integer, minimum: 1, maximum: 20, default: 3 }
        enabled: { type: boolean, default: true }
    MonitorPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        url: { type: string, format: uri }
        method: { type: string, enum: [GET, HEAD] }
        check_interval_seconds: { type: integer, minimum: 5 }
        timeout_ms: { type: integer, minimum: 100, maximum: 60000 }
        expected_status_min: { type: integer, minimum: 100, maximum: 599 }
        expected_status_max: { type: integer, minimum: 100, maximum: 599 }
        failure_threshold: { type: integer, minimum: 1, maximum: 20 }
        enabled: { type: boolean }
    MonitorPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Monitor" }
    MonitorStatus:
      type: string
      enum: [UP, DOWN, DEGRADED, UNKNOWN]

    CheckResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        monitor_id: { type: string, format: uuid }
        outcome: { type: string, enum: [UP, DOWN] }
        computed_status: { $ref: "#/components/schemas/MonitorStatus" }
        consecutive_failures: { type: integer, minimum: 0 }
        status_code: { type: integer }
        response_time_ms: { type: integer, format: int64 }
        error_message: { type: string }
        checked_at: { type: string, format: date-time }
    MonitoringSummary:
      type: object
      properties:
        monitor_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MonitorStatus" }
        consecutive_failures: { type: integer, minimum: 0 }
        last_status_code: { type: integer }
        last_response_time_ms: { type: integer, format: int64 }
        last_checked_at: { type: string, format: date-time }
        uptime_24h: { type: number }
        average_response_time_ms: { type: number }
        total_checks_24h: { type: integer, format: int64 }
        up_checks_24h: { type: integer, format: int64 }
        down_checks_24h: { type: integer, format: int64 }
    AlertRuleInput:
      type: object
      additionalProperties: false
      required: [enabled, webhook_url, failure_threshold, failure_window_seconds, latency_threshold_ms, latency_consecutive_checks, cooldown_seconds, notify_recovery]
      properties:
        enabled: { type: boolean }
        webhook_url: { type: string, format: uri, description: Public HTTP(S) webhook destination. }
        failure_threshold: { type: integer, minimum: 1, maximum: 20 }
        failure_window_seconds: { type: integer, minimum: 30, maximum: 86400 }
        latency_threshold_ms: { type: integer, format: int64, minimum: 0, maximum: 600000, description: Zero disables latency incidents. }
        latency_consecutive_checks: { type: integer, minimum: 1, maximum: 20 }
        cooldown_seconds: { type: integer, minimum: 0, maximum: 86400 }
        notify_recovery: { type: boolean }
    AlertRule:
      type: object
      required: [monitor_id, enabled, webhook_configured, signing_secret_configured, failure_threshold, failure_window_seconds, latency_threshold_ms, latency_consecutive_checks, cooldown_seconds, notify_recovery]
      properties:
        id: { type: string, format: uuid }
        monitor_id: { type: string, format: uuid }
        enabled: { type: boolean }
        webhook_configured: { type: boolean }
        signing_secret_configured: { type: boolean }
        signing_secret: { type: string, description: One-time reveal returned only when a rule is first created. }
        failure_threshold: { type: integer, minimum: 1, maximum: 20 }
        failure_window_seconds: { type: integer, minimum: 30, maximum: 86400 }
        latency_threshold_ms: { type: integer, format: int64, minimum: 0, maximum: 600000 }
        latency_consecutive_checks: { type: integer, minimum: 1, maximum: 20 }
        cooldown_seconds: { type: integer, minimum: 0, maximum: 86400 }
        notify_recovery: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SigningSecretRotation:
      type: object
      required: [signing_secret, rotated_at]
      properties:
        signing_secret: { type: string, description: One-time webhook HMAC key reveal. }
        rotated_at: { type: string, format: date-time }
    IncidentStatus:
      type: string
      enum: [OPEN, ACKNOWLEDGED, RESOLVED]
    Incident:
      type: object
      required: [id, monitor_id, monitor_name, environment_name, application_id, application_name, kind, status, summary, started_at, last_observation_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        monitor_id: { type: string, format: uuid }
        monitor_name: { type: string }
        environment_name: { type: string }
        application_id: { type: string, format: uuid }
        application_name: { type: string }
        kind: { type: string, enum: [AVAILABILITY, LATENCY] }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        summary: { type: string }
        trigger_check_result_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        last_observation_at: { type: string, format: date-time }
        acknowledged_at: { type: string, format: date-time }
        acknowledged_by: { type: string }
        resolved_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AcknowledgementInput:
      type: object
      additionalProperties: false
      required: [acknowledged_by]
      properties:
        acknowledged_by: { type: string, minLength: 1, maxLength: 120 }
    IncidentEvent:
      type: object
      required: [id, incident_id, event_type, message, metadata, created_at]
      properties:
        id: { type: string, format: uuid }
        incident_id: { type: string, format: uuid }
        event_type: { type: string, enum: [OPENED, ACKNOWLEDGED, RESOLVED, NOTIFICATION_QUEUED, NOTIFICATION_DELIVERED, NOTIFICATION_FAILED] }
        message: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    NotificationDelivery:
      type: object
      required: [id, incident_id, event_type, channel, status, attempts, max_attempts, next_attempt_at, response_status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        incident_id: { type: string, format: uuid }
        event_type: { type: string, enum: [INCIDENT_OPENED, INCIDENT_RESOLVED] }
        channel: { type: string, enum: [WEBHOOK] }
        status: { type: string, enum: [PENDING, SENDING, DELIVERED, FAILED] }
        attempts: { type: integer }
        max_attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time }
        response_status: { type: integer }
        last_error: { type: string }
        delivered_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MaintenanceInput:
      type: object
      additionalProperties: false
      required: [reason, starts_at, ends_at]
      properties:
        reason: { type: string, minLength: 1, maxLength: 240 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    MaintenanceWindow:
      allOf:
        - $ref: "#/components/schemas/MaintenanceInput"
        - type: object
          required: [id, monitor_id, created_at]
          properties:
            id: { type: string, format: uuid }
            monitor_id: { type: string, format: uuid }
            cancelled_at: { type: string, format: date-time }
            created_at: { type: string, format: date-time }
    ApplicationOverview:
      type: object
      required: [id, name, owner, status, monitors, last_status_code, last_response_time_ms, uptime_24h, average_response_time_ms, total_checks_24h, up_checks_24h, down_checks_24h]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        owner: { type: string }
        status: { $ref: "#/components/schemas/MonitorStatus" }
        monitors: { type: integer, format: int64 }
        last_status_code: { type: integer }
        last_response_time_ms: { type: integer, format: int64 }
        last_checked_at: { type: string, format: date-time }
        uptime_24h: { type: number, minimum: 0, maximum: 100 }
        average_response_time_ms: { type: number }
        total_checks_24h: { type: integer, format: int64 }
        up_checks_24h: { type: integer, format: int64 }
        down_checks_24h: { type: integer, format: int64 }
    ApplicationDashboard:
      allOf:
        - $ref: "#/components/schemas/ApplicationOverview"
        - type: object
          required: [period_hours, period_summary, generated_at, environments, timeline, recent_events]
          properties:
            period_hours: { type: integer, enum: [1, 6, 24, 168, 720] }
            period_summary: { $ref: "#/components/schemas/PeriodSummary" }
            generated_at: { type: string, format: date-time }
            environments:
              type: array
              items: { $ref: "#/components/schemas/DashboardEnvironment" }
            timeline:
              type: array
              items: { $ref: "#/components/schemas/MetricPoint" }
            recent_events:
              type: array
              items: { $ref: "#/components/schemas/RecentEvent" }
    PeriodSummary:
      type: object
      required: [uptime, average_response_time_ms, total_checks, up_checks, down_checks]
      properties:
        uptime: { type: number, minimum: 0, maximum: 100 }
        average_response_time_ms: { type: number }
        total_checks: { type: integer, format: int64 }
        up_checks: { type: integer, format: int64 }
        down_checks: { type: integer, format: int64 }
    DashboardEnvironment:
      type: object
      required: [id, name, base_url, enabled, status, monitors]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        base_url: { type: string, format: uri }
        enabled: { type: boolean }
        status: { $ref: "#/components/schemas/MonitorStatus" }
        monitors:
          type: array
          items: { $ref: "#/components/schemas/DashboardMonitor" }
    DashboardMonitor:
      type: object
      required: [id, environment_id, name, url, method, enabled, effective_enabled, status, last_status_code, last_response_time_ms, uptime, average_response_time_ms, total_checks]
      properties:
        id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string, format: uri }
        method: { type: string, enum: [GET, HEAD] }
        enabled: { type: boolean }
        effective_enabled: { type: boolean }
        status: { $ref: "#/components/schemas/MonitorStatus" }
        last_status_code: { type: integer }
        last_response_time_ms: { type: integer, format: int64 }
        last_checked_at: { type: string, format: date-time }
        uptime: { type: number, minimum: 0, maximum: 100 }
        average_response_time_ms: { type: number }
        total_checks: { type: integer, format: int64 }
    MetricPoint:
      type: object
      required: [timestamp, uptime, average_response_time_ms, checks]
      properties:
        timestamp: { type: string, format: date-time }
        uptime: { type: number, minimum: 0, maximum: 100 }
        average_response_time_ms: { type: number }
        checks: { type: integer, format: int64 }
    RecentEvent:
      type: object
      required: [id, monitor_id, monitor_name, environment_name, outcome, computed_status, status_code, response_time_ms, checked_at]
      properties:
        id: { type: string, format: uuid }
        monitor_id: { type: string, format: uuid }
        monitor_name: { type: string }
        environment_name: { type: string }
        outcome: { type: string, enum: [UP, DOWN] }
        computed_status: { $ref: "#/components/schemas/MonitorStatus" }
        status_code: { type: integer }
        response_time_ms: { type: integer, format: int64 }
        error_message: { type: string }
        checked_at: { type: string, format: date-time }
    Page:
      type: object
      required: [items, limit, offset]
      properties:
        limit: { type: integer }
        offset: { type: integer }
